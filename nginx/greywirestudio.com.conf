# nginx site for greywirestudio.com on the EC2 server, installed as
# /etc/nginx/conf.d/greywirestudio.com.conf. This is the starting version:
# certbot --nginx adds the HTTPS server and the redirect from HTTP when it
# gets the certificate, so the server's copy is longer than this one.
server {
    listen 80;
    server_name greywirestudio.com www.greywirestudio.com;

    root /var/www/greywirestudio.com;
    index index.html;
    error_page 404 /404.html;

    # Static site: never serve dotfiles
    location ~ /\. { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }
}
