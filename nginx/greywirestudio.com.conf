# nginx site for greywirestudio.com on the EC2 server, installed as
# /etc/nginx/conf.d/greywirestudio.com.conf. This is the starting version:
# certbot --nginx adds the HTTPS server and the redirect from HTTP when it
# gets the certificate, so the server's copy is longer than this one.
server {
    listen 80;
    server_name greywirestudio.com www.greywirestudio.com;

    root /var/www/greywirestudio.com;
    index index.html;
    error_page 404 /404.html;

    # Static site: never serve dotfiles
    location ~ /\. { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }

    # Survey forms post to the Breakroom backend container (routes/surveys.js),
    # which redirects back to a page here. X-Real-IP is how it spots repeat
    # submissions, so it must come from the connection, not the visitor.
    location /api/surveys/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
    }
}
