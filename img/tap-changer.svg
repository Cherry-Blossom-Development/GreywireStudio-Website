<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300" font-family="Arial, Helvetica, sans-serif">
  <title>Tap Changer clean boost (illustration)</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f8a63"/>
      <stop offset="1" stop-color="#24563c"/>
    </linearGradient>
    <radialGradient id="knob" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#4a4f55"/>
      <stop offset="1" stop-color="#1b1d20"/>
    </radialGradient>
  </defs>
  <rect x="6" y="6" width="188" height="288" rx="16" fill="url(#body)" stroke="#173a28" stroke-width="2"/>

  <!-- Endless knobs with 11-LED rings -->
    <g>
      <circle cx="100" cy="76" r="38" fill="#173a28" fill-opacity="0.55"/>
      <g><circle cx="84.0" cy="103.7" r="2.4" fill="#d6f5e2"/><circle cx="72.3" cy="92.0" r="2.4" fill="#d6f5e2"/><circle cx="68.0" cy="76.0" r="2.4" fill="#d6f5e2"/><circle cx="72.3" cy="60.0" r="2.4" fill="#d6f5e2"/><circle cx="84.0" cy="48.3" r="2.4" fill="#d6f5e2"/><circle cx="100.0" cy="44.0" r="2.4" fill="#d6f5e2"/><circle cx="116.0" cy="48.3" r="2.4" fill="#d6f5e2"/><circle cx="127.7" cy="60.0" r="2.4" fill="#d6f5e2"/><circle cx="132.0" cy="76.0" r="2.4" fill="#173a28"/><circle cx="127.7" cy="92.0" r="2.4" fill="#173a28"/><circle cx="116.0" cy="103.7" r="2.4" fill="#173a28"/></g>
      <circle cx="100" cy="76" r="21" fill="url(#knob)"/>
    </g>
  <text x="100" y="134" font-size="9" fill="#d9f0e2" text-anchor="middle" letter-spacing="1">LEVEL</text>


  <!-- Name -->
  <text x="100" y="180" font-size="17" font-weight="700" fill="#ffffff" fill-opacity="0.95" text-anchor="middle" letter-spacing="2.5">TAP</text>
  <text x="100" y="199" font-size="17" font-weight="700" fill="#ffffff" fill-opacity="0.95" text-anchor="middle" letter-spacing="2.5">CHANGER</text>
  <text x="100" y="214" font-size="7.5" fill="#d9f0e2" text-anchor="middle" letter-spacing="2.5">GREYWIRE · LINEWORK</text>

  <!-- On LED, Link LED and footswitch -->
  <circle cx="100" cy="230" r="3.5" fill="#ff6a3d"/>
  <circle cx="100" cy="230" r="7.700000000000001" fill="#ff6a3d" fill-opacity="0.25"/>
  <circle cx="160" cy="230" r="3" fill="#7fd0ff"/>
  <circle cx="160" cy="230" r="6.6000000000000005" fill="#7fd0ff" fill-opacity="0.25"/>
  <text x="160" y="246" font-size="7" fill="#d9f0e2" text-anchor="middle" letter-spacing="1">LINK</text>
  <circle cx="100" cy="264" r="20" fill="#b7bcc2" stroke="#6b7076" stroke-width="2"/>
  <circle cx="100" cy="264" r="13" fill="#d7dbe0" stroke="#8a8f95"/>
</svg>
