<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300" font-family="Arial, Helvetica, sans-serif">
  <title>Rolling Blackout tremolo (illustration)</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3b3f"/>
      <stop offset="1" stop-color="#202124"/>
    </linearGradient>
    <radialGradient id="knob" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#4a4f55"/>
      <stop offset="1" stop-color="#1b1d20"/>
    </radialGradient>
  </defs>
  <rect x="6" y="6" width="188" height="288" rx="16" fill="url(#body)" stroke="#111214" stroke-width="2"/>

  <!-- Endless knobs with 11-LED rings -->
    <g>
      <circle cx="48" cy="64" r="25" fill="#111214" fill-opacity="0.55"/>
      <g><circle cx="38.0" cy="81.3" r="1.9" fill="#ffc95e"/><circle cx="30.7" cy="74.0" r="1.9" fill="#ffc95e"/><circle cx="28.0" cy="64.0" r="1.9" fill="#ffc95e"/><circle cx="30.7" cy="54.0" r="1.9" fill="#ffc95e"/><circle cx="38.0" cy="46.7" r="1.9" fill="#ffc95e"/><circle cx="48.0" cy="44.0" r="1.9" fill="#ffc95e"/><circle cx="58.0" cy="46.7" r="1.9" fill="#111214"/><circle cx="65.3" cy="54.0" r="1.9" fill="#111214"/><circle cx="68.0" cy="64.0" r="1.9" fill="#111214"/><circle cx="65.3" cy="74.0" r="1.9" fill="#111214"/><circle cx="58.0" cy="81.3" r="1.9" fill="#111214"/></g>
      <circle cx="48" cy="64" r="14" fill="url(#knob)"/>
    </g>
    <g>
      <circle cx="100" cy="64" r="25" fill="#111214" fill-opacity="0.55"/>
      <g><circle cx="90.0" cy="81.3" r="1.9" fill="#ffc95e"/><circle cx="82.7" cy="74.0" r="1.9" fill="#ffc95e"/><circle cx="80.0" cy="64.0" r="1.9" fill="#ffc95e"/><circle cx="82.7" cy="54.0" r="1.9" fill="#ffc95e"/><circle cx="90.0" cy="46.7" r="1.9" fill="#ffc95e"/><circle cx="100.0" cy="44.0" r="1.9" fill="#ffc95e"/><circle cx="110.0" cy="46.7" r="1.9" fill="#ffc95e"/><circle cx="117.3" cy="54.0" r="1.9" fill="#ffc95e"/><circle cx="120.0" cy="64.0" r="1.9" fill="#ffc95e"/><circle cx="117.3" cy="74.0" r="1.9" fill="#111214"/><circle cx="110.0" cy="81.3" r="1.9" fill="#111214"/></g>
      <circle cx="100" cy="64" r="14" fill="url(#knob)"/>
    </g>
    <g>
      <circle cx="152" cy="64" r="25" fill="#111214" fill-opacity="0.55"/>
      <g><circle cx="142.0" cy="81.3" r="1.9" fill="#111214"/><circle cx="134.7" cy="74.0" r="1.9" fill="#111214"/><circle cx="132.0" cy="64.0" r="1.9" fill="#111214"/><circle cx="134.7" cy="54.0" r="1.9" fill="#ffc95e"/><circle cx="142.0" cy="46.7" r="1.9" fill="#111214"/><circle cx="152.0" cy="44.0" r="1.9" fill="#111214"/><circle cx="162.0" cy="46.7" r="1.9" fill="#111214"/><circle cx="169.3" cy="54.0" r="1.9" fill="#111214"/><circle cx="172.0" cy="64.0" r="1.9" fill="#111214"/><circle cx="169.3" cy="74.0" r="1.9" fill="#111214"/><circle cx="162.0" cy="81.3" r="1.9" fill="#111214"/></g>
      <circle cx="152" cy="64" r="14" fill="url(#knob)"/>
    </g>
  <text x="48" y="104" font-size="9" fill="#f1d9a6" text-anchor="middle" letter-spacing="1">RATE</text>
  <text x="100" y="104" font-size="9" fill="#f1d9a6" text-anchor="middle" letter-spacing="1">DEPTH</text>
  <text x="152" y="104" font-size="9" fill="#f1d9a6" text-anchor="middle" letter-spacing="1">SHAPE</text>

  <!-- Tempo LED: blinks with the song tempo -->
  <circle cx="100" cy="130" r="3" fill="#ffb03a"/>
  <circle cx="100" cy="130" r="6.6000000000000005" fill="#ffb03a" fill-opacity="0.25"/>
  <text x="100" y="148" font-size="8" fill="#f1d9a6" text-anchor="middle" letter-spacing="1">TEMPO</text>

  <!-- Name -->
  <text x="100" y="180" font-size="17" font-weight="700" fill="#ffffff" fill-opacity="0.95" text-anchor="middle" letter-spacing="2.5">ROLLING</text>
  <text x="100" y="199" font-size="17" font-weight="700" fill="#ffffff" fill-opacity="0.95" text-anchor="middle" letter-spacing="2.5">BLACKOUT</text>
  <text x="100" y="214" font-size="7.5" fill="#f1d9a6" text-anchor="middle" letter-spacing="2.5">GREYWIRE · LINEWORK</text>

  <!-- On LED, Link LED and footswitch -->
  <circle cx="100" cy="230" r="3.5" fill="#ffb03a"/>
  <circle cx="100" cy="230" r="7.700000000000001" fill="#ffb03a" fill-opacity="0.25"/>
  <circle cx="160" cy="230" r="3" fill="#7fd0ff"/>
  <circle cx="160" cy="230" r="6.6000000000000005" fill="#7fd0ff" fill-opacity="0.25"/>
  <text x="160" y="246" font-size="7" fill="#f1d9a6" text-anchor="middle" letter-spacing="1">LINK</text>
  <circle cx="100" cy="264" r="20" fill="#b7bcc2" stroke="#6b7076" stroke-width="2"/>
  <circle cx="100" cy="264" r="13" fill="#d7dbe0" stroke="#8a8f95"/>
</svg>
