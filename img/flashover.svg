<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300" font-family="Arial, Helvetica, sans-serif">
  <title>Flashover pedal (illustration)</title>
  <defs>
    <linearGradient id="fo-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c0602f"/>
      <stop offset="1" stop-color="#8f4120"/>
    </linearGradient>
    <radialGradient id="fo-knob" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#4a4f55"/>
      <stop offset="1" stop-color="#1b1d20"/>
    </radialGradient>
  </defs>
  <rect x="6" y="6" width="188" height="288" rx="16" fill="url(#fo-body)" stroke="#5c2a14" stroke-width="2"/>

  <!-- Gain, Tone, Level: endless knobs with LED rings -->
  <g fill="#f3c6a2" fill-opacity="0.9">
    <g transform="translate(48 64)">
      <circle r="24" fill="#5c2a14" fill-opacity="0.55"/>
      <g fill="#ffd9b8"><circle cx="-17" cy="12" r="2"/><circle cx="-20" cy="0" r="2"/><circle cx="-17" cy="-12" r="2"/><circle cx="-7" cy="-20" r="2"/><circle cx="7" cy="-20" r="2"/></g>
      <g fill="#5c2a14"><circle cx="17" cy="-12" r="2"/><circle cx="20" cy="0" r="2"/><circle cx="17" cy="12" r="2"/></g>
      <circle r="14" fill="url(#fo-knob)"/>
      <line x1="0" y1="-4" x2="0" y2="-12" stroke="#e8e6e1" stroke-width="2" stroke-linecap="round" transform="rotate(20)"/>
    </g>
    <g transform="translate(100 64)">
      <circle r="24" fill="#5c2a14" fill-opacity="0.55"/>
      <g fill="#ffd9b8"><circle cx="-17" cy="12" r="2"/><circle cx="-20" cy="0" r="2"/><circle cx="-17" cy="-12" r="2"/></g>
      <g fill="#5c2a14"><circle cx="-7" cy="-20" r="2"/><circle cx="7" cy="-20" r="2"/><circle cx="17" cy="-12" r="2"/><circle cx="20" cy="0" r="2"/><circle cx="17" cy="12" r="2"/></g>
      <circle r="14" fill="url(#fo-knob)"/>
      <line x1="0" y1="-4" x2="0" y2="-12" stroke="#e8e6e1" stroke-width="2" stroke-linecap="round" transform="rotate(-60)"/>
    </g>
    <g transform="translate(152 64)">
      <circle r="24" fill="#5c2a14" fill-opacity="0.55"/>
      <g fill="#ffd9b8"><circle cx="-17" cy="12" r="2"/><circle cx="-20" cy="0" r="2"/><circle cx="-17" cy="-12" r="2"/><circle cx="-7" cy="-20" r="2"/></g>
      <g fill="#5c2a14"><circle cx="7" cy="-20" r="2"/><circle cx="17" cy="-12" r="2"/><circle cx="20" cy="0" r="2"/><circle cx="17" cy="12" r="2"/></g>
      <circle r="14" fill="url(#fo-knob)"/>
      <line x1="0" y1="-4" x2="0" y2="-12" stroke="#e8e6e1" stroke-width="2" stroke-linecap="round" transform="rotate(-25)"/>
    </g>
  </g>
  <g font-size="9" fill="#fbe3cf" text-anchor="middle" letter-spacing="1">
    <text x="48" y="104">GAIN</text>
    <text x="100" y="104">TONE</text>
    <text x="152" y="104">LEVEL</text>
  </g>

  <!-- Soft / Hard button with its two LEDs -->
  <circle cx="72" cy="132" r="3.5" fill="#5c2a14"/>
  <circle cx="128" cy="132" r="3.5" fill="#ffb15e"/>
  <circle cx="128" cy="132" r="7" fill="#ffb15e" fill-opacity="0.25"/>
  <rect x="88" y="123" width="24" height="18" rx="4" fill="#26292d" stroke="#5c2a14"/>
  <g font-size="8" fill="#fbe3cf" text-anchor="middle" letter-spacing="1">
    <text x="72" y="152">SOFT</text>
    <text x="128" y="152">HARD</text>
  </g>

  <text x="100" y="188" font-size="19" font-weight="700" fill="#fff4ea" text-anchor="middle" letter-spacing="3">FLASHOVER</text>
  <text x="100" y="203" font-size="7.5" fill="#fbe3cf" text-anchor="middle" letter-spacing="2.5">GREYWIRE · LINEWORK</text>

  <!-- On LED and footswitch -->
  <circle cx="100" cy="222" r="3.5" fill="#ff6a3d"/>
  <circle cx="100" cy="222" r="8" fill="#ff6a3d" fill-opacity="0.25"/>
  <circle cx="100" cy="258" r="20" fill="#b7bcc2" stroke="#6b7076" stroke-width="2"/>
  <circle cx="100" cy="258" r="13" fill="#d7dbe0" stroke="#8a8f95"/>
</svg>
