<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300" font-family="Arial, Helvetica, sans-serif">
  <title>Double Circuit chorus (illustration)</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a8790"/>
      <stop offset="1" stop-color="#185158"/>
    </linearGradient>
    <radialGradient id="knob" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#4a4f55"/>
      <stop offset="1" stop-color="#1b1d20"/>
    </radialGradient>
  </defs>
  <rect x="6" y="6" width="188" height="288" rx="16" fill="url(#body)" stroke="#0d3338" stroke-width="2"/>

  <!-- Endless knobs with 11-LED rings -->
    <g>
      <circle cx="48" cy="64" r="25" fill="#0d3338" fill-opacity="0.55"/>
      <g><circle cx="38.0" cy="81.3" r="1.9" fill="#d4fbff"/><circle cx="30.7" cy="74.0" r="1.9" fill="#d4fbff"/><circle cx="28.0" cy="64.0" r="1.9" fill="#d4fbff"/><circle cx="30.7" cy="54.0" r="1.9" fill="#0d3338"/><circle cx="38.0" cy="46.7" r="1.9" fill="#0d3338"/><circle cx="48.0" cy="44.0" r="1.9" fill="#0d3338"/><circle cx="58.0" cy="46.7" r="1.9" fill="#0d3338"/><circle cx="65.3" cy="54.0" r="1.9" fill="#0d3338"/><circle cx="68.0" cy="64.0" r="1.9" fill="#0d3338"/><circle cx="65.3" cy="74.0" r="1.9" fill="#0d3338"/><circle cx="58.0" cy="81.3" r="1.9" fill="#0d3338"/></g>
      <circle cx="48" cy="64" r="14" fill="url(#knob)"/>
    </g>
    <g>
      <circle cx="100" cy="64" r="25" fill="#0d3338" fill-opacity="0.55"/>
      <g><circle cx="90.0" cy="81.3" r="1.9" fill="#d4fbff"/><circle cx="82.7" cy="74.0" r="1.9" fill="#d4fbff"/><circle cx="80.0" cy="64.0" r="1.9" fill="#d4fbff"/><circle cx="82.7" cy="54.0" r="1.9" fill="#d4fbff"/><circle cx="90.0" cy="46.7" r="1.9" fill="#d4fbff"/><circle cx="100.0" cy="44.0" r="1.9" fill="#d4fbff"/><circle cx="110.0" cy="46.7" r="1.9" fill="#0d3338"/><circle cx="117.3" cy="54.0" r="1.9" fill="#0d3338"/><circle cx="120.0" cy="64.0" r="1.9" fill="#0d3338"/><circle cx="117.3" cy="74.0" r="1.9" fill="#0d3338"/><circle cx="110.0" cy="81.3" r="1.9" fill="#0d3338"/></g>
      <circle cx="100" cy="64" r="14" fill="url(#knob)"/>
    </g>
    <g>
      <circle cx="152" cy="64" r="25" fill="#0d3338" fill-opacity="0.55"/>
      <g><circle cx="142.0" cy="81.3" r="1.9" fill="#d4fbff"/><circle cx="134.7" cy="74.0" r="1.9" fill="#d4fbff"/><circle cx="132.0" cy="64.0" r="1.9" fill="#d4fbff"/><circle cx="134.7" cy="54.0" r="1.9" fill="#d4fbff"/><circle cx="142.0" cy="46.7" r="1.9" fill="#d4fbff"/><circle cx="152.0" cy="44.0" r="1.9" fill="#0d3338"/><circle cx="162.0" cy="46.7" r="1.9" fill="#0d3338"/><circle cx="169.3" cy="54.0" r="1.9" fill="#0d3338"/><circle cx="172.0" cy="64.0" r="1.9" fill="#0d3338"/><circle cx="169.3" cy="74.0" r="1.9" fill="#0d3338"/><circle cx="162.0" cy="81.3" r="1.9" fill="#0d3338"/></g>
      <circle cx="152" cy="64" r="14" fill="url(#knob)"/>
    </g>
  <text x="48" y="104" font-size="9" fill="#d3eef1" text-anchor="middle" letter-spacing="1">RATE</text>
  <text x="100" y="104" font-size="9" fill="#d3eef1" text-anchor="middle" letter-spacing="1">DEPTH</text>
  <text x="152" y="104" font-size="9" fill="#d3eef1" text-anchor="middle" letter-spacing="1">MIX</text>

  <!-- Chorus / Vibrato button with its two LEDs -->
  <circle cx="68" cy="132" r="3.5" fill="#9ff3ff"/>
  <circle cx="68" cy="132" r="7.700000000000001" fill="#9ff3ff" fill-opacity="0.25"/>
  <circle cx="132" cy="132" r="3.5" fill="#00000055"/>
  <rect x="88" y="123" width="24" height="18" rx="4" fill="#26292d" stroke="#0d3338"/>
  <text x="68" y="152" font-size="8" fill="#d3eef1" text-anchor="middle" letter-spacing="1">CHORUS</text>
  <text x="132" y="152" font-size="8" fill="#d3eef1" text-anchor="middle" letter-spacing="1">VIBRATO</text>

  <!-- Name -->
  <text x="100" y="180" font-size="17" font-weight="700" fill="#ffffff" fill-opacity="0.95" text-anchor="middle" letter-spacing="2.5">DOUBLE</text>
  <text x="100" y="199" font-size="17" font-weight="700" fill="#ffffff" fill-opacity="0.95" text-anchor="middle" letter-spacing="2.5">CIRCUIT</text>
  <text x="100" y="214" font-size="7.5" fill="#d3eef1" text-anchor="middle" letter-spacing="2.5">GREYWIRE · LINEWORK</text>

  <!-- On LED, Link LED and footswitch -->
  <circle cx="100" cy="230" r="3.5" fill="#ff6a3d"/>
  <circle cx="100" cy="230" r="7.700000000000001" fill="#ff6a3d" fill-opacity="0.25"/>
  <circle cx="160" cy="230" r="3" fill="#7fd0ff"/>
  <circle cx="160" cy="230" r="6.6000000000000005" fill="#7fd0ff" fill-opacity="0.25"/>
  <text x="160" y="246" font-size="7" fill="#d3eef1" text-anchor="middle" letter-spacing="1">LINK</text>
  <circle cx="100" cy="264" r="20" fill="#b7bcc2" stroke="#6b7076" stroke-width="2"/>
  <circle cx="100" cy="264" r="13" fill="#d7dbe0" stroke="#8a8f95"/>
</svg>
